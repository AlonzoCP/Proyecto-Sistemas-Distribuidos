# Redis Cluster - nodo de TechOrders U3 (3 maestros + 3 réplicas)
bind 0.0.0.0
protected-mode no
port 6379
dir /data

# --- Modo clúster: sharding nativo en 16.384 hash slots + elección automática
cluster-enabled yes
cluster-config-file nodes.conf
# Un maestro sin responder por 5 s se considera caído y su réplica se promueve
cluster-node-timeout 5000
# Si un shard completo cae, los demás shards siguen atendiendo sus slots
cluster-require-full-coverage no
cluster-replica-validity-factor 10
cluster-migration-barrier 1

# --- Persistencia AOF (durabilidad de las trazas de auditoría)
appendonly yes
appendfsync everysec
