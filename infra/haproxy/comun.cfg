# ---------------------------------------------------------------------------
# Sección común a todos los balanceadores HAProxy de TechOrders U3
# ---------------------------------------------------------------------------
global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 1s
    timeout client 30s
    timeout server 25s
    timeout check 1s
    timeout http-request 10s
    # Reintentos: si un servidor falla, la petición se reenvía a OTRO servidor
    retries 2
    option redispatch 1

# DNS interno de Docker: si un contenedor se reinicia con otra IP, HAProxy la
# vuelve a resolver sin recargar la configuración.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    # Contenedor detenido -> Docker responde NXDOMAIN -> fuera del pool en 5 s.
    # Si el DNS solo falla o tarda, se conserva la última IP conocida 30 s.
    hold valid 5s
    hold nx 5s
    hold obsolete 5s
    hold timeout 30s
    hold refused 30s
    hold other 30s
    accepted_payload_size 8192

# Página de estadísticas (la lee el Health Dashboard) y health check del propio balanceador
frontend stats
    bind :8404
    monitor-uri /lb-health
    stats enable
    stats uri /stats
    stats refresh 2s
    stats show-legends
