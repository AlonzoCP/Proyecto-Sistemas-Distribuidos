# ---------------------------------------------------------------------------
# Balanceador INTERNO (lb-int-1, lb-int-2) - red-servicios
# Módulo A -> réplicas del Módulo B (:5000) y del Módulo C (:6000)
# ---------------------------------------------------------------------------
# Least Connections: el costo de cada llamada interna varía (escrituras con replicación
# semisíncrona, listados, reintentos durante un failover). Medido con +300 ms en una
# réplica: Round Robin le envió el 47 % del tráfico; Least Connections, el 19 %.
frontend dominio
    bind :5000
    default_backend modulo_b

frontend auditoria
    bind :6000
    default_backend modulo_c

backend modulo_b
    balance leastconn
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    option http-buffer-request
    # El Gateway ya reintenta con backoff; aquí solo se reintenta si falla la conexión
    retry-on conn-failure empty-response
    http-response set-header X-Backend-Server %[srv_name]
    default-server check inter 2s fastinter 500ms fall 2 rise 2 resolvers docker init-addr last,libc,none
    server modulo-b-1 modulo-b-1:5000
    server modulo-b-2 modulo-b-2:5000

backend modulo_c
    balance leastconn
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    option http-buffer-request
    retry-on conn-failure empty-response
    http-response set-header X-Backend-Server %[srv_name]
    default-server check inter 2s fastinter 500ms fall 2 rise 2 resolvers docker init-addr last,libc,none
    server modulo-c-1 modulo-c-1:6000
    server modulo-c-2 modulo-c-2:6000
