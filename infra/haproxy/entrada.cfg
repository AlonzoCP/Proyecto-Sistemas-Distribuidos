# ---------------------------------------------------------------------------
# Balanceador de ENTRADA (lb-1, lb-2) - red-frontend
# Cliente/SPA -> réplicas del Módulo A (API Gateway)
# ---------------------------------------------------------------------------
frontend publico
    bind :8080
    # request_id único por petición; se mantiene igual si HAProxy reintenta en otro
    # gateway, por lo que el reintento es idempotente (no duplica pedidos).
    http-request set-header X-Request-Id %[uuid()] unless { req.hdr(X-Request-Id) -m found }
    http-request set-header X-LB-Node %[hostname]
    http-response set-header X-LB-Node %[hostname]
    default_backend gateways

backend gateways
    balance roundrobin
    # Health check ACTIVO: GET /health cada 2 s; 2 fallos -> fuera del pool; 2 éxitos -> vuelve
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    # Reintento L7 en otro gateway si la conexión falla o el gateway muere a mitad de respuesta
    option http-buffer-request
    retry-on conn-failure empty-response response-timeout
    default-server check inter 2s fastinter 500ms fall 2 rise 2 resolvers docker init-addr last,libc,none
    server modulo-a-1 modulo-a-1:8080
    server modulo-a-2 modulo-a-2:8080
